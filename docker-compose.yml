name: kosmiteia

#

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${KOSMITEIA_PORT:-8090}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'FS_METHOD', 'direct' );
        define( 'WP_HOME', '${KOSMITEIA_URL:-http://localhost:8090}' );
        define( 'WP_SITEURL', '${KOSMITEIA_URL:-http://localhost:8090}' );
    volumes:
      - wp-data:/var/www/html
      - ./kosmiteia:/var/www/html/wp-content/themes/kosmiteia
      - ./plugins/kosmiteia-core:/var/www/html/wp-content/plugins/kosmiteia-core

  provision:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      KOSMITEIA_URL: "${KOSMITEIA_URL:-http://localhost:8090}"
      KOSMITEIA_ADMIN_USER: "${KOSMITEIA_ADMIN_USER:-admin}"
      KOSMITEIA_ADMIN_PASSWORD: "${KOSMITEIA_ADMIN_PASSWORD:-admin}"
      KOSMITEIA_ADMIN_EMAIL: "${KOSMITEIA_ADMIN_EMAIL:-admin@example.edu}"
      KOSMITEIA_RESEED: "${KOSMITEIA_RESEED:-0}"
      HOME: /tmp
    volumes:
      - wp-data:/var/www/html
      - ./kosmiteia:/var/www/html/wp-content/themes/kosmiteia
      - ./plugins/kosmiteia-core:/var/www/html/wp-content/plugins/kosmiteia-core
      - ./docker:/provision:ro
    entrypoint: ["/bin/sh", "/provision/provision.sh"]

volumes:
  db-data:
  wp-data:
